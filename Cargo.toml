[workspace]
resolver = "2"
members = ["crates/git-core", "crates/ramus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# GPUI is not published as a stable crate; pin a Zed commit and upgrade deliberately.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1478fb5e60f8b7852a2b0da32aa3da5cd9bb6954" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1478fb5e60f8b7852a2b0da32aa3da5cd9bb6954", features = ["font-kit"] }
git-core = { path = "crates/git-core" }
