[workspace]
resolver = "2"
members = ["crates/git-core", "crates/ramus"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiangzhe0812/ramus"

[workspace.dependencies]
# GPUI is not published as a stable crate. gpui-component pins the `gpui-pre` snapshot
# crates, so we use the same snapshot to keep a single copy of GPUI in the build.
# Upgrade gpui, gpui_platform and gpui-component together.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-component = "0.9.0"
libc = "0.2"
git-core = { path = "crates/git-core" }

[profile.release]
# Debug info makes a shipped binary several times larger; function names stay for backtraces.
strip = "debuginfo"
