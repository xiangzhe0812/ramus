name: Release PR

# After every merge to main, release-please keeps one "chore(main): release x.y.z" pull
# request up to date: the next version (in Cargo.toml and Cargo.lock) and a CHANGELOG.md
# entry, worked out from the titles of the PRs merged since the last release. Only `feat:`,
# `fix:`, `perf:` and `revert:` PRs count; `docs:`, `ci:`, `chore:` and the like, and any
# change that only touches .github/ or docs/, never make a release.
#
# Merging that release PR is what ships: release-please tags it and creates the GitHub
# release, and the job below builds the disk image and attaches it. The build is called from
# here because a tag that GitHub Actions creates does not start other workflows by itself.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two quick merges must not race to update the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: update the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Actions are pinned to full commit SHAs, not tags a maintainer could move.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    name: build and publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The most the called workflow may use; its build job still runs read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
