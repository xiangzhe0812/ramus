name: Release

# Pushing a tag like `v0.1.0` builds the installer and publishes it as a GitHub release.
# "Run workflow" (any branch) builds the same installer and keeps it as a downloadable
# artifact without publishing anything, which is how to try a build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building needs no write access; only the publish job below asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build the installer
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # Actions are pinned to full commit SHAs, not tags a maintainer could move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # GPUI compiles Metal shaders, which needs Xcode's Metal toolchain.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # A release must be built from the version it claims to be.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build Ramus.app and the disk image
        run: packaging/macos/build.sh

      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ramus-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    # Only a tag publishes; a manual run stops after uploading the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ramus-macos
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Anything before 1.0 is announced as a pre-release.
          case "$TAG" in v0.*) flag="--prerelease" ;; *) flag="" ;; esac
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ramus $TAG" \
            --generate-notes \
            --verify-tag \
            $flag
