name: Release

# Pushing a tag like `v0.1.0` builds the installer and publishes it as a GitHub release.
# "Run workflow" (any branch) builds the same installer and stops there, which is how to try
# a build without publishing anything.
#
# The build and the publish are separate jobs so that the one that compiles third-party code
# has no write access. The finished files cross between them through the Actions *cache*, not
# artifact storage: the account's artifact quota can be full (and stay full for hours after
# files are deleted), while the cache has its own limit and evicts old entries instead of
# refusing new ones.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing gets write access by default. Only the small publish job below asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build the installer
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # Actions are pinned to full commit SHAs, not tags a maintainer could move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # GPUI compiles Metal shaders, which needs Xcode's Metal toolchain.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # A release must be built from the version it claims to be.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      # This job compiles hundreds of third-party crates, build scripts included, so it
      # holds no write access: a compromised dependency could not touch the repository.
      - name: Build Ramus.app and the disk image
        run: packaging/macos/build.sh

      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The hand-off to the publish job. The key is per run (not per attempt) so a re-run of
      # just the publish job still finds it.
      - name: Hand the files to the publish job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          key: release-${{ github.run_id }}

      # For a manual rehearsal, which publishes nothing: keep the build for a day so it can be
      # downloaded and tried. Best effort, since artifact storage may be full.
      - name: Keep the build for a day (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ramus-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    # Only a tag publishes; a manual run stops after the build.
    if: startsWith(github.ref, 'refs/tags/v')
    # Same operating system as the build, so the cache archive restores the same way.
    runs-on: macos-latest
    # The only job allowed to write to the repository. It runs no build code: it downloads
    # the finished files and attaches them to the release.
    permissions:
      contents: write
    steps:
      - name: Get the files from the build job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          key: release-${{ github.run_id }}
          # Publishing nothing is better than publishing the wrong thing.
          fail-on-cache-miss: true

      # What was restored must be exactly what the checksum file says.
      - name: Verify the checksum
        run: cd dist && shasum -a 256 -c SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Anything before 1.0 is announced as a pre-release.
          case "$TAG" in v0.*) flag="--prerelease" ;; *) flag="" ;; esac
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ramus $TAG" \
            --generate-notes \
            --verify-tag \
            $flag
